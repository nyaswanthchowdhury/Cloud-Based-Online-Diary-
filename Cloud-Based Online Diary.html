<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Diary</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 50px;
        }

        .login-box {
            max-width: 450px;
            margin: 80px auto;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        h2 {
            color: #444;
            margin-bottom: 20px;
        }

        p {
            color: #666;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 15px;
            margin-right: 5px;
        }

        button:hover {
            background: #5568d8;
        }

        .logout {
            background: #e74c3c;
        }

        .logout:hover {
            background: #c0392b;
        }

        .delete {
            background: #e74c3c;
        }

        .edit {
            background: #f39c12;
        }

        .register {
            background: #27ae60;
        }

        .hidden {
            display: none;
        }

        .topbar {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .topbar h1 {
            margin-bottom: 5px;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .entry {
            background: #f5f6ff;
            border-left: 5px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .entry h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .entry-date {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
        }

        .entry-content {
            white-space: pre-wrap;
            line-height: 1.6;
            color: #555;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .link {
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
        }

        .search-box {
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .topbar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .box {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="box login-box">

        <h1>📖 Cloud Diary</h1>

        <p style="margin-bottom:25px;">
            Login to your personal online diary
        </p>

        <div id="loginMessage"></div>

        <label>Username</label>
        <input
            type="text"
            id="loginUsername"
            placeholder="Enter username"
        >

        <label>Password</label>
        <input
            type="password"
            id="loginPassword"
            placeholder="Enter password"
        >

        <button onclick="login()">Login</button>

        <button
            class="register"
            onclick="showRegister()"
        >
            Register
        </button>

        <p style="margin-top:20px;">
            Demo account:
            <b>admin</b> /
            <b>123456</b>
        </p>

    </div>


    <!-- REGISTER PAGE -->
    <div id="registerPage" class="box login-box hidden">

        <h1>📝 Create Account</h1>

        <p style="margin-bottom:25px;">
            Create your Cloud Diary account
        </p>

        <div id="registerMessage"></div>

        <label>Username</label>
        <input
            type="text"
            id="registerUsername"
            placeholder="Create username"
        >

        <label>Password</label>
        <input
            type="password"
            id="registerPassword"
            placeholder="Create password"
        >

        <label>Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
        >

        <button
            class="register"
            onclick="registerUser()"
        >
            Create Account
        </button>

        <button onclick="showLogin()">
            Back to Login
        </button>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboardPage" class="hidden">

        <div class="topbar">

            <div>
                <h1>📖 My Cloud Diary</h1>

                <p>
                    Welcome,
                    <b id="currentUser"></b>
                </p>
            </div>

            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>


        <!-- ADD DIARY -->
        <div class="form-box">

            <h2>✍️ Write a New Diary Entry</h2>

            <input
                type="text"
                id="entryTitle"
                placeholder="Diary title"
            >

            <textarea
                id="entryContent"
                placeholder="Write your thoughts here..."
            ></textarea>

            <button onclick="saveEntry()">
                Save Diary Entry
            </button>

            <button
                id="cancelButton"
                class="hidden"
                onclick="cancelEdit()"
            >
                Cancel
            </button>

        </div>


        <!-- SEARCH -->
        <div class="form-box">

            <h2>🔍 Search Diary</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search diary entries..."
                onkeyup="displayEntries()"
            >

        </div>


        <!-- DIARY ENTRIES -->
        <div class="form-box">

            <h2>📚 My Diary Entries</h2>

            <div id="entriesList"></div>

        </div>

    </div>

</div>


<script>

    // --------------------------------
    // DATA STORAGE
    // --------------------------------

    let users = JSON.parse(
        localStorage.getItem("cloudDiaryUsers")
    ) || [];

    let entries = JSON.parse(
        localStorage.getItem("cloudDiaryEntries")
    ) || [];

    let currentUser = localStorage.getItem(
        "cloudDiaryCurrentUser"
    );

    let editingId = null;


    // --------------------------------
    // CREATE DEFAULT ADMIN ACCOUNT
    // --------------------------------

    if (users.length === 0) {

        users.push({
            username: "admin",
            password: "123456"
        });

        localStorage.setItem(
            "cloudDiaryUsers",
            JSON.stringify(users)
        );
    }


    // --------------------------------
    // PAGE CONTROL
    // --------------------------------

    function showLogin() {

        document
            .getElementById("loginPage")
            .classList.remove("hidden");

        document
            .getElementById("registerPage")
            .classList.add("hidden");

        document
            .getElementById("dashboardPage")
            .classList.add("hidden");
    }


    function showRegister() {

        document
            .getElementById("loginPage")
            .classList.add("hidden");

        document
            .getElementById("registerPage")
            .classList.remove("hidden");

        document
            .getElementById("dashboardPage")
            .classList.add("hidden");
    }


    function showDashboard() {

        document
            .getElementById("loginPage")
            .classList.add("hidden");

        document
            .getElementById("registerPage")
            .classList.add("hidden");

        document
            .getElementById("dashboardPage")
            .classList.remove("hidden");

        document.getElementById(
            "currentUser"
        ).textContent = currentUser;

        displayEntries();
    }


    // --------------------------------
    // REGISTER
    // --------------------------------

    function registerUser() {

        let username =
            document.getElementById(
                "registerUsername"
            ).value.trim();

        let password =
            document.getElementById(
                "registerPassword"
            ).value;

        let confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;

        let message =
            document.getElementById(
                "registerMessage"
            );


        if (username === "" || password === "") {

            message.innerHTML =
                '<div class="message error">' +
                'Please fill all fields.' +
                '</div>';

            return;
        }


        if (password.length < 6) {

            message.innerHTML =
                '<div class="message error">' +
                'Password must contain at least 6 characters.' +
                '</div>';

            return;
        }


        if (password !== confirmPassword) {

            message.innerHTML =
                '<div class="message error">' +
                'Passwords do not match.' +
                '</div>';

            return;
        }


        let existingUser = users.find(
            user => user.username === username
        );


        if (existingUser) {

            message.innerHTML =
                '<div class="message error">' +
                'Username already exists.' +
                '</div>';

            return;
        }


        users.push({
            username: username,
            password: password
        });


        localStorage.setItem(
            "cloudDiaryUsers",
            JSON.stringify(users)
        );


        message.innerHTML =
            '<div class="message">' +
            'Account created successfully!' +
            '</div>';


        document.getElementById(
            "registerUsername"
        ).value = "";

        document.getElementById(
            "registerPassword"
        ).value = "";

        document.getElementById(
            "confirmPassword"
        ).value = "";


        setTimeout(
            showLogin,
            1000
        );
    }


    // --------------------------------
    // LOGIN
    // --------------------------------

    function login() {

        let username =
            document.getElementById(
                "loginUsername"
            ).value.trim();

        let password =
            document.getElementById(
                "loginPassword"
            ).value;

        let message =
            document.getElementById(
                "loginMessage"
            );


        let user = users.find(
            user =>
                user.username === username &&
                user.password === password
        );


        if (!user) {

            message.innerHTML =
                '<div class="message error">' +
                'Invalid username or password.' +
                '</div>';

            return;
        }


        currentUser = username;


        localStorage.setItem(
            "cloudDiaryCurrentUser",
            currentUser
        );


        document.getElementById(
            "loginUsername"
        ).value = "";

        document.getElementById(
            "loginPassword"
        ).value = "";


        showDashboard();
    }


    // --------------------------------
    // LOGOUT
    // --------------------------------

    function logout() {

        currentUser = null;

        localStorage.removeItem(
            "cloudDiaryCurrentUser"
        );

        showLogin();
    }


    // --------------------------------
    // SAVE DIARY ENTRY
    // --------------------------------

    function saveEntry() {

        let title =
            document.getElementById(
                "entryTitle"
            ).value.trim();

        let content =
            document.getElementById(
                "entryContent"
            ).value.trim();


        if (title === "" || content === "") {

            alert(
                "Please enter both title and diary content."
            );

            return;
        }


        if (editingId !== null) {

            let entry = entries.find(
                item => item.id === editingId
            );


            if (entry) {

                entry.title = title;
                entry.content = content;

                entry.date =
                    new Date().toLocaleString();
            }


            editingId = null;

            document.getElementById(
                "cancelButton"
            ).classList.add("hidden");

        } else {

            let newEntry = {

                id: Date.now(),

                username: currentUser,

                title: title,

                content: content,

                date: new Date().toLocaleString()
            };


            entries.push(newEntry);
        }


        localStorage.setItem(
            "cloudDiaryEntries",
            JSON.stringify(entries)
        );


        document.getElementById(
            "entryTitle"
        ).value = "";

        document.getElementById(
            "entryContent"
        ).value = "";


        displayEntries();
    }


    // --------------------------------
    // DISPLAY ENTRIES
    // --------------------------------

    function displayEntries() {

        let list =
            document.getElementById(
                "entriesList"
            );

        let search =
            document.getElementById(
                "searchInput"
            ).value.toLowerCase();


        let userEntries = entries.filter(
            entry =>
                entry.username === currentUser
        );


        if (search !== "") {

            userEntries = userEntries.filter(
                entry =>
                    entry.title
                        .toLowerCase()
                        .includes(search)
                    ||
                    entry.content
                        .toLowerCase()
                        .includes(search)
            );
        }


        userEntries.reverse();


        if (userEntries.length === 0) {

            list.innerHTML =
                "<p>No diary entries found.</p>";

            return;
        }


        list.innerHTML = "";


        userEntries.forEach(
            entry => {

                let div =
                    document.createElement("div");

                div.className = "entry";


                div.innerHTML = `

                    <h3>
                        ${escapeHTML(entry.title)}
                    </h3>

                    <div class="entry-date">
                        ${entry.date}
                    </div>

                    <div class="entry-content">
                        ${escapeHTML(entry.content)}
                    </div>

                    <button
                        class="edit"
                        onclick="editEntry(${entry.id})"
                    >
                        Edit
                    </button>

                    <button
                        class="delete"
                        onclick="deleteEntry(${entry.id})"
                    >
                        Delete
                    </button>
                `;


                list.appendChild(div);
            }
        );
    }


    // --------------------------------
    // EDIT ENTRY
    // --------------------------------

    function editEntry(id) {

        let entry = entries.find(
            item => item.id === id
        );


        if (!entry) {
            return;
        }


        document.getElementById(
            "entryTitle"
        ).value = entry.title;


        document.getElementById(
            "entryContent"
        ).value = entry.content;


        editingId = id;


        document.getElementById(
            "cancelButton"
        ).classList.remove("hidden");


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    // --------------------------------
    // CANCEL EDIT
    // --------------------------------

    function cancelEdit() {

        editingId = null;


        document.getElementById(
            "entryTitle"
        ).value = "";


        document.getElementById(
            "entryContent"
        ).value = "";


        document.getElementById(
            "cancelButton"
        ).classList.add("hidden");
    }


    // --------------------------------
    // DELETE ENTRY
    // --------------------------------

    function deleteEntry(id) {

        let confirmDelete =
            confirm(
                "Are you sure you want to delete this diary entry?"
            );


        if (!confirmDelete) {
            return;
        }


        entries = entries.filter(
            entry => entry.id !== id
        );


        localStorage.setItem(
            "cloudDiaryEntries",
            JSON.stringify(entries)
        );


        displayEntries();
    }


    // --------------------------------
    // HTML SECURITY
    // --------------------------------

    function escapeHTML(text) {

        let div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    // --------------------------------
    // AUTO LOGIN
    // --------------------------------

    if (currentUser) {
        showDashboard();
    } else {
        showLogin();
    }

</script>

</body>
</html>
